name: Manual Full Site Sync (Fallback)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-full-site-sync
  cancel-in-progress: false

jobs:
  sync-all-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Trigger full site sync
        env:
          SOLAR_TRACKER_SYNC_URL: ${{ secrets.SOLAR_TRACKER_SYNC_URL }}
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          sync_url="${SOLAR_TRACKER_SYNC_URL:-${APP_URL:-}}"

          if [[ -z "${sync_url}" ]]; then
            echo "SOLAR_TRACKER_SYNC_URL repository secret is required. APP_URL is also accepted for existing setups."
            exit 1
          fi

          if [[ -z "${CRON_SECRET}" ]]; then
            echo "CRON_SECRET repository secret is required."
            exit 1
          fi

          curl --fail-with-body --show-error --silent --max-time 10800 \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${sync_url%/}/api/internal/sync-all"
